[package]
name = "bklogics"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

# cdylib + staticlib required for mobile (iOS/Android)
[lib]
name = "bklogics_lib"
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# iOS-only: save images to the Photos library
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-photos = "0.3"
